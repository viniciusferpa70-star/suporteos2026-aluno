databaseChangeLog:
  - changeSet:
      id: 004-garantia-informatica
      author: projeto-estudante
      comment: Prazo contratual informado pela loja; zero representa prazo nao informado.
      changes:
        - addColumn:
            tableName: produto
            columns:
              - column:
                  name: garantia_meses
                  type: INTEGER
                  defaultValueNumeric: 0
        - sql:
            sql: UPDATE produto SET garantia_meses = 0 WHERE garantia_meses IS NULL
        - addNotNullConstraint:
            tableName: produto
            columnName: garantia_meses
            columnDataType: INTEGER
        - sql:
            sql: ALTER TABLE produto ADD CONSTRAINT ck_produto_garantia CHECK (garantia_meses BETWEEN 0 AND 60)
